name: ci

# ./ci.sh is the whole check. This repo is public, so it runs on GitHub's own runners (free for
# public repos) and never on the Mac mini: a public repo's pull requests can come from anyone, and
# self-hosted runners would run their code on that machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run ./ci.sh
        run: ./ci.sh
